name: P4 hybrid packages preflight one-shot

on:
  push:
    branches:
      - prod/p4-hybrid-packages-v1
    paths:
      - .github/workflows/p4-hybrid-packages-preflight-one-shot.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: stefm78/audio-engine
          ref: fd1e2a97b44207e4dc6024257d15f4ce8e55bde9
          path: .audio-engine
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ./.audio-engine

      - name: Validate exact hybrid packages
        shell: bash
        run: |
          set -euo pipefail
          vox=series/odyssee/production/provider-packages/P4_SIRENS_VOXCPM2_PRODUCTION_V1.json
          chat=series/odyssee/production/provider-packages/P4_SIRENS_CHATTERBOX_BASELINE_V1.json
          voices=series/odyssee/production/voice-packs/ODYSSEE_PRODUCTION_V1.json

          audio-engine provider-package validate "$vox"
          audio-engine provider-package validate "$chat"

          expected_voice=511cc106c6d4061e2f94ad453cd7ff530a624e3c52db138bf52a29eec115a894
          actual_voice="$(sha256sum "$voices" | awk '{print $1}')"
          test "$actual_voice" = "$expected_voice"

          python - <<'PY'
          import json
          vox=json.load(open("series/odyssee/production/provider-packages/P4_SIRENS_VOXCPM2_PRODUCTION_V1.json",encoding="utf-8"))
          chat=json.load(open("series/odyssee/production/provider-packages/P4_SIRENS_CHATTERBOX_BASELINE_V1.json",encoding="utf-8"))
          assert vox["acceptance"]["production_mapping"]=="HOLD_P4_FROZEN_S09_LINE_BINDING_REQUIRED"
          assert chat["acceptance"]["production_mapping"]=="HOLD_P4_FROZEN_S09_LINE_BINDING_REQUIRED"
          assert vox["acceptance"]["accepted_probe_replacement_indices"]==[2,4,6,8,12]
          assert chat["acceptance"]["preserved_probe_indices"]==[3,5,7,11]
          assert vox["fallback"]==chat["fallback"]=="fail"
          print("P4_HYBRID_PACKAGES_PREFLIGHT_PASS")
          PY

          sha256sum "$vox" "$chat" "$voices"
