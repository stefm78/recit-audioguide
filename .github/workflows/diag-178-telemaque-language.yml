name: DIAG 178 Télémaque language integrity

on:
  push:
    branches:
      - 'diag/178-telemaque-language-integrity'
    paths:
      - '.github/workflows/diag-178-telemaque-language.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install independent ASR diagnostic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check faster-whisper==1.2.0 requests

      - name: Download immutable HUMAN FAIL father repair
        run: |
          curl -fL             'https://github.com/stefm78/recit-audioguide/releases/download/odyssee-p7-r2-father-context-repair-v1/p7-r2-father-context-repair.mp3'             -o father.mp3
          echo 'df8f7fd96e6ca799209fbad44c5e3619edebde78dcb27d41a3f0fdf2c30cd28a  father.mp3' | sha256sum -c -

      - name: Independent language diagnosis
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          from faster_whisper import WhisperModel

          AUDIO = Path("father.mp3")
          OUT = Path("diag-178")
          OUT.mkdir(exist_ok=True)

          probe = subprocess.run(
              [
                  "ffmpeg", "-hide_banner", "-i", str(AUDIO),
                  "-af", "silencedetect=noise=-45dB:d=0.05",
                  "-f", "null", "-"
              ],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.PIPE,
              text=True,
              check=False,
          )
          intervals = []
          start = None
          for line in probe.stderr.splitlines():
              match = re.search(r"silence_start: ([0-9.]+)", line)
              if match:
                  start = float(match.group(1))
              match = re.search(
                  r"silence_end: ([0-9.]+) \| silence_duration: ([0-9.]+)",
                  line,
              )
              if match and start is not None:
                  intervals.append([start, float(match.group(1))])
                  start = None

          merged = []
          for begin, end in intervals:
              if merged and begin - merged[-1][1] < 0.15:
                  merged[-1][1] = end
              else:
                  merged.append([begin, end])

          duration = float(
              subprocess.check_output(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      str(AUDIO),
                  ],
                  text=True,
              ).strip()
          )

          speech = []
          cursor = 0.0
          for begin, end in merged:
              if begin - cursor >= 0.12:
                  speech.append([cursor, begin])
              cursor = max(cursor, end)
          if duration - cursor >= 0.12:
              speech.append([cursor, duration])

          model = WhisperModel("small", device="cpu", compute_type="int8")

          full_segments, full_info = model.transcribe(
              str(AUDIO),
              beam_size=5,
              word_timestamps=True,
              condition_on_previous_text=False,
              vad_filter=False,
          )
          full = []
          for seg in full_segments:
              words = []
              for word in seg.words or []:
                  words.append({
                      "start": round(float(word.start), 3),
                      "end": round(float(word.end), 3),
                      "word": word.word,
                      "probability": round(float(word.probability), 4),
                  })
              full.append({
                  "start": round(float(seg.start), 3),
                  "end": round(float(seg.end), 3),
                  "text": seg.text,
                  "avg_logprob": round(float(seg.avg_logprob), 4),
                  "no_speech_prob": round(float(seg.no_speech_prob), 4),
                  "words": words,
              })

          chunks = []
          for index, (begin, end) in enumerate(speech, start=1):
              if end - begin < 0.15:
                  continue
              wav = OUT / f"speech-{index:02d}.wav"
              clip_start = max(0.0, begin - 0.05)
              clip_end = min(duration, end + 0.05)
              subprocess.run(
                  [
                      "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                      "-ss", f"{clip_start:.3f}",
                      "-to", f"{clip_end:.3f}",
                      "-i", str(AUDIO),
                      "-ac", "1", "-ar", "16000",
                      "-c:a", "pcm_s16le",
                      str(wav),
                  ],
                  check=True,
              )
              segments, info = model.transcribe(
                  str(wav),
                  beam_size=5,
                  condition_on_previous_text=False,
                  vad_filter=False,
              )
              text_value = "".join(segment.text for segment in segments).strip()
              chunks.append({
                  "chunk": index,
                  "start": round(begin, 3),
                  "end": round(end, 3),
                  "duration": round(end - begin, 3),
                  "language": info.language,
                  "language_probability": round(float(info.language_probability), 4),
                  "text": text_value,
              })

          result = {
              "schema": "recit.odyssee.diag178.telemaque_language.v1",
              "source_release": "odyssee-p7-r2-father-context-repair-v1",
              "source_audio_sha256": "df8f7fd96e6ca799209fbad44c5e3619edebde78dcb27d41a3f0fdf2c30cd28a",
              "method": {
                  "asr": "faster-whisper 1.2.0 / Whisper small / CPU int8",
                  "language": "auto-detect",
                  "silence_detector": "-45dB / 0.05s / merge <0.15s",
                  "production_audio_modified": False,
                  "new_tts_render": False,
              },
              "full_audio_language": full_info.language,
              "full_audio_language_probability": round(float(full_info.language_probability), 4),
              "silence_intervals": [
                  {
                      "start": round(a, 3),
                      "end": round(b, 3),
                      "duration": round(b-a, 3),
                  }
                  for a,b in merged
              ],
              "full_transcript": full,
              "speech_chunks": chunks,
          }
          Path("diag-178/result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print("FULL_LANGUAGE", result["full_audio_language"], result["full_audio_language_probability"])
          print("FULL_TRANSCRIPT")
          for item in full:
              print(f'{item["start"]:6.3f}-{item["end"]:6.3f} {item["text"]}')
          print("CHUNK_LANGUAGE")
          for item in chunks:
              print(
                  f'{item["chunk"]:02d} {item["start"]:6.3f}-{item["end"]:6.3f} '
                  f'lang={item["language"]} p={item["language_probability"]:.4f} '
                  f'text={item["text"]!r}'
              )
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: diag-178-telemaque-language
          path: diag-178/result.json
          if-no-files-found: error
          retention-days: 14
