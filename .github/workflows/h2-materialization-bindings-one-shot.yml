name: H2 materialization bindings one-shot

on:
  push:
    branches:
      - prod/h2-materialization-v1
    paths:
      - .github/workflows/h2-materialization-bindings-one-shot.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: stefm78/audio-engine
          ref: e82559cbd60b1d29de208e7e36ccd7505dcfcdcc
          path: .audio-engine
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install engine
        run: python -m pip install --disable-pip-version-check ./.audio-engine
      - name: Verify exact H2 bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          v1=json.load(open("series/odyssee/production/voice-packs/ODYSSEE_PRODUCTION_V1.json",encoding="utf-8"))
          v2=json.load(open("series/odyssee/production/voice-packs/ODYSSEE_PRODUCTION_H2_V2.json",encoding="utf-8"))
          p1={x["id"]:x for x in v1["presets"]}
          p2={x["id"]:x for x in v2["presets"]}
          assert p1.keys()==p2.keys()
          changed=[key for key in p1 if p1[key]!=p2[key]]
          assert changed==["odyssee-marin-h2"], changed
          marin=p2["odyssee-marin-h2"]
          expected={
            "voice":"fr-FR-AlainNeural",
            "rate":"+2%",
            "pitch":"+0Hz",
            "volume":"+2%",
            "provider":"edge",
          }
          for key,value in expected.items():
              assert marin[key]==value,(key,marin[key],value)
          result=json.load(open("series/odyssee/production/H2_SOUND_ACQUISITION_RESULT_V1.json",encoding="utf-8"))
          assert [x["status"] for x in result["results"]]==["no-selection"]*3
          assert result["stop_condition"]=="SATISFIED"
          print(json.dumps({"changed_presets":changed,"marin":marin,"acquisition":result},ensure_ascii=False,indent=2))
          PY
          sha256sum             series/odyssee/production/voice-packs/ODYSSEE_PRODUCTION_H2_V2.json             series/odyssee/production/H2_SOUND_ACQUISITION_RESULT_V1.json
