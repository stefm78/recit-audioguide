name: Ephemeral PR42 durable review release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ephemeral-pr42-review-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 203268827d5c5e7d7312545f465b653c5bd31690
      ENGINE_SHA: e3657805b0ab1c7a21e060379c42bb5b7f7a5497
      AUDIO_ARTIFACT_ID: '9730988448'
      PREVIEW_ARTIFACT_ID: '9730983736'
      RELEASE_TAG: pr42-human-review-v2
      MASTER_SHA256: 4fa33d168796ef745dc9bfae95ec58135490b673c048c998c8bda029d3674893
      PROGRAM_BLOB: a966f1e6572d8ed7897181ce7c404d3cf10d6a34
      DIRECTION_BLOB: a51f7799bd5be6ac44913aa19ab0b1dae5f7470d
      SERIES_BLOB: 6dff9bfe13ca77adc3370ba42aed73591d0bcecf
      WATER_SHA256: 6cab6c85a0b9159aa9e98f30bef16e5f8976a3154d8cec4e00925aac21289f0b

    steps:
      - name: Checkout main for self cleanup
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout frozen PR42 candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1

      - name: Verify frozen source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse "$CANDIDATE_SHA:series/nuit-apres-orleans/audio/nuit-apres-orleans-ep01.json")" = "$PROGRAM_BLOB"
          test "$(git -C candidate rev-parse "$CANDIDATE_SHA:series/nuit-apres-orleans/direction/nuit-apres-orleans-ep01.direction.json")" = "$DIRECTION_BLOB"
          test "$(git -C candidate rev-parse "$CANDIDATE_SHA:series/nuit-apres-orleans/series.json")" = "$SERIES_BLOB"
          test "$(gh api "/repos/stefm78/audio-engine/commits/$ENGINE_SHA" --jq .sha)" = "$ENGINE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download exact rerun artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr42/audio /tmp/pr42/previews /tmp/pr42/release
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUDIO_ARTIFACT_ID/zip" > /tmp/pr42/audio.zip
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIEW_ARTIFACT_ID/zip" > /tmp/pr42/previews.zip
          unzip -q /tmp/pr42/audio.zip -d /tmp/pr42/audio
          unzip -q /tmp/pr42/previews.zip -d /tmp/pr42/previews
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify master, timings, events and upstream water
        shell: bash
        run: |
          set -euo pipefail
          MASTER=/tmp/pr42/audio/nuit-apres-orleans-ep01/audio.mp3
          PREVIEW_MASTER=/tmp/pr42/previews/nuit-apres-orleans-ep01-full.mp3
          test "$(sha256sum "$MASTER" | awk '{print $1}')" = "$MASTER_SHA256"
          test "$(sha256sum "$PREVIEW_MASTER" | awk '{print $1}')" = "$MASTER_SHA256"

          curl -fsSL             https://upload.wikimedia.org/wikipedia/commons/2/26/Flowing-water-100019.ogg             -o /tmp/pr42/Flowing-water-100019.ogg
          test "$(sha256sum /tmp/pr42/Flowing-water-100019.ogg | awk '{print $1}')" = "$WATER_SHA256"

          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path

          audio = Path('/tmp/pr42/audio')
          previews = Path('/tmp/pr42/previews')
          release = Path('/tmp/pr42/release')
          manifest = json.loads((audio/'nuit-apres-orleans-ep01/manifest.json').read_text(encoding='utf-8'))
          timing = json.loads((previews/'nuit-apres-orleans-ep01-timing.json').read_text(encoding='utf-8'))
          preview = json.loads((previews/'nuit-apres-orleans-ep01-preview.json').read_text(encoding='utf-8'))

          components = ((manifest.get('mix') or {}).get('soundscape') or {}).get('components') or []
          assert manifest['status'] == 'success'
          assert manifest['engine_version'] == '0.9.2'
          assert manifest['provider']['name'] == 'edge'
          assert manifest['audio']['duration_seconds'] == 660.84
          assert manifest['audio']['bitrate_kbps'] == 96
          assert manifest['audio']['sample_rate_hz'] == 24000
          assert manifest['audio']['channels'] == 2
          assert manifest.get('warnings') == []
          assert timing['exact_segments'] == 150
          assert timing['estimated_segments'] == 0
          assert len(timing['segments']) == 150
          assert len(preview['previews']) == 7
          assert len(components) == 7
          assert all(not c['duration_clipped'] for c in components)
          assert all(not c['clipped_by_source'] for c in components)
          assert all(not c['clipped_by_master'] for c in components)

          water = [c for c in components if c['sound'] == 'river-water-flow']
          assert len(water) == 2
          assert all(c['source_sha256'] == os.environ['WATER_SHA256'] for c in water)
          assert all(c['license']['id'] == 'Public-Domain' for c in water)

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          qa = {
            'schema_version': 1,
            'status': 'PASS',
            'candidate_sha': os.environ['CANDIDATE_SHA'],
            'audio_engine_sha': os.environ['ENGINE_SHA'],
            'source_blobs': {
              'program': os.environ['PROGRAM_BLOB'],
              'sound_direction': os.environ['DIRECTION_BLOB'],
              'series': os.environ['SERIES_BLOB'],
            },
            'workflow_run': 32704598278,
            'workflow_attempt': 2,
            'source_artifacts': {
              'audio': int(os.environ['AUDIO_ARTIFACT_ID']),
              'previews': int(os.environ['PREVIEW_ARTIFACT_ID']),
            },
            'master': {
              'sha256': sha256(audio/'nuit-apres-orleans-ep01/audio.mp3'),
              'duration_seconds': manifest['audio']['duration_seconds'],
              'bitrate_kbps': manifest['audio']['bitrate_kbps'],
              'sample_rate_hz': manifest['audio']['sample_rate_hz'],
              'channels': manifest['audio']['channels'],
            },
            'timing': {
              'segments': len(timing['segments']),
              'exact_segments': timing['exact_segments'],
              'estimated_segments': timing['estimated_segments'],
              'total_speech_ms': timing['total_speech_ms'],
            },
            'soundscape': {
              'events': len(components),
              'duration_clipped': sum(bool(c['duration_clipped']) for c in components),
              'clipped_by_source': sum(bool(c['clipped_by_source']) for c in components),
              'clipped_by_master': sum(bool(c['clipped_by_master']) for c in components),
            },
            'water_source': {
              'page': 'https://commons.wikimedia.org/wiki/File:Flowing-water-100019.ogg',
              'original': 'https://upload.wikimedia.org/wikipedia/commons/2/26/Flowing-water-100019.ogg',
              'sha1_upstream': '9257b9c6596ac22e2ad792191b57fc6e629c9455',
              'sha256_render_authority': os.environ['WATER_SHA256'],
              'license': 'Public-Domain',
              'attribution': 'Fg2',
            },
            'historical_note': {
              'pr_description_duration_seconds': 726.5,
              'frozen_cache_master_duration_seconds': 660.84,
              'decision': 'frozen cache master is review authority; stale PR metrics must not override recovered bytes'
            },
            'human_gate': 'PENDING'
          }
          (release/'qa.json').write_text(json.dumps(qa, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Stage durable review assets
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/pr42/release
          A=/tmp/pr42/audio/nuit-apres-orleans-ep01
          P=/tmp/pr42/previews

          cp "$A/audio.mp3" "$R/master.mp3"
          cp "$A/manifest.json" "$R/manifest.json"
          cp "$A/transcript.json" "$R/transcript.json"
          cp "$P/nuit-apres-orleans-ep01-timing.json" "$R/timing.json"
          cp "$P/nuit-apres-orleans-ep01-preview.json" "$R/preview.json"

          for n in 01 02 03 04 05 06 07; do
            cp "$P/nuit-apres-orleans-ep01-event-$n.mp3" "$R/event-$n.mp3"
          done

          (
            cd "$R"
            sha256sum master.mp3 manifest.json transcript.json timing.json preview.json event-*.mp3 qa.json > checksums.txt
          )

      - name: Publish immutable review surface
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to mutate durable review authority."
            exit 1
          fi
          gh release create "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --target "$CANDIDATE_SHA"             --title "PR #42 — human review V2"             --notes "Durable human-review surface for frozen PR #42. Candidate: $CANDIDATE_SHA. Audio Engine: $ENGINE_SHA. Workflow run 32704598278 attempt 2 restored the exact historical cache: 76/76 catalog cache hits, zero renders, zero failures. Human listening gate remains pending."
          gh release upload "$RELEASE_TAG" /tmp/pr42/release/*             --repo "$GITHUB_REPOSITORY"

      - name: Self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ephemeral-pr42-review-release.yml
          git commit -m "chore: remove ephemeral PR42 review release workflow"
          git push origin HEAD:main
