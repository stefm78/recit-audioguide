name: Ephemeral historical branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ephemeral-historical-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Delete exact closed historical refs
        uses: actions/github-script@v7
        with:
          script: |
            const expected = {
              "production-v1": "0b9a5d6272115f816a230bc75c0683cc19e1b3eb",
              "audit-production-states": "ac412a3144acdfc3d1e31b178f1b4f2a28c16e0a",
              "player-simple-controls-v1": "3d302935ec5c7c2c94ac643bab711dd709bf4110",
              "production-v1-final": "0e176db5de315a1f61df68208950cbb91165328d",
              "gov/GOV-WP-001-historical-branch-closeout": "6f78dfe91ad89848cd41c1974f58256bb88e5686"
            };

            for (const [name, sha] of Object.entries(expected)) {
              const current = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${name}`
              });
              if (current.data.object.sha !== sha) {
                core.setFailed(`Ref guard failed for ${name}: expected ${sha}, got ${current.data.object.sha}`);
                return;
              }
            }

            for (const name of Object.keys(expected)) {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${name}`
              });
              core.info(`Deleted historical ref: ${name}`);
            }

            const protectedName = "feature/nuit-apres-orleans-prototype";
            const protectedSha = "203268827d5c5e7d7312545f465b653c5bd31690";
            const protectedRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${protectedName}`
            });
            if (protectedRef.data.object.sha !== protectedSha) {
              core.setFailed(`Protected PR #42 ref moved unexpectedly: ${protectedRef.data.object.sha}`);
              return;
            }
            core.info("PR #42 branch preserved at exact expected HEAD.");

      - name: Self-delete cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ephemeral-historical-branch-cleanup.yml
          git commit -m "chore: remove ephemeral historical branch cleanup"
          git push origin HEAD:main
