name: Odyssée production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'series/odyssee/production/ODYSSEE_PRODUCTION_MANIFEST_V1.json'
      - 'series/odyssee/production/voice-packs/**'
      - 'series/odyssee/production/provider-packages/**'
      - 'series/odyssee/programs/**'
      - '.github/workflows/odyssee-production.yml'

concurrency:
  group: odyssee-production
  cancel-in-progress: false

jobs:
  production:
    permissions:
      contents: write
    uses: stefm78/audio-engine/.github/workflows/production.yml@a3af1565f7b6799bced8dbb318fafd5807bafafc
    with:
      manifest_path: series/odyssee/production/ODYSSEE_PRODUCTION_MANIFEST_V1.json
      artifact_prefix: odyssee-production-v1
      cache_namespace: odyssee-production-v1
      max_parallel: 12
      publish_release: false
      publish_review_release: true
      review_release_tag: odyssee-h2-integrated-review-v1
      review_release_prerelease: true
