name: Odyssée production

on:
  workflow_dispatch:
    inputs:
      publish_review_release:
        description: Publish immutable machine-qualified review assets; never a final master
        required: false
        default: false
        type: boolean
      review_release_tag:
        description: Immutable review Release tag; required when publishing review assets
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'series/odyssee/production/ODYSSEE_PRODUCTION_MANIFEST_V1.json'
      - 'series/odyssee/production/voice-packs/**'
      - 'series/odyssee/production/provider-packages/**'
      - 'series/odyssee/programs/**'
      - '.github/workflows/odyssee-production.yml'

concurrency:
  group: odyssee-production
  cancel-in-progress: false

jobs:
  production:
    permissions:
      contents: write
    uses: stefm78/audio-engine/.github/workflows/production.yml@2409c14ab82e9cbdba8d37cfde714d8aa8f31d48
    with:
      manifest_path: series/odyssee/production/ODYSSEE_PRODUCTION_MANIFEST_V1.json
      artifact_prefix: odyssee-production-v1
      cache_namespace: odyssee-production-v1
      fresh_scene_cache_units_json: '["S09"]'
      max_parallel: 12
      publish_release: false
      publish_review_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_review_release }}
      review_release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.review_release_tag || '' }}
      review_release_prerelease: true
