name: Ephemeral safe branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ephemeral-safe-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Delete only exact safe refs
        uses: actions/github-script@v7
        with:
          script: |
            const expected = {
              "noop-check": "ede520904394a2e78e576ec332ba085142e27451",
              "production-v1-sequences": "ede520904394a2e78e576ec332ba085142e27451",
              "production-v1-sequences-impl": "ede520904394a2e78e576ec332ba085142e27451",
              "ci/CI-WP-001-change-aware-audio": "cd08243380842ad30431c95906b2fc530f1a8b94",
              "prod/PROD-WP-004-real-production-plan": "8e9e2984cf09c8e05e86517945acc141e05391ce",
              "prod/PROD-WP-004-longform-fit-audit": "97c32fc1bf177e840dd9f83ef5e9e9852d7d83b1",
              "ci/CI-WP-002-engine-pin-coherence": "e4814a437c264137553d1e0825859bb1d8ba5d82"
            };

            for (const [name, sha] of Object.entries(expected)) {
              const ref = `heads/${name}`;
              const current = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
              if (current.data.object.sha !== sha) {
                core.setFailed(`Ref guard failed for ${name}: expected ${sha}, got ${current.data.object.sha}`);
                return;
              }
            }

            for (const name of Object.keys(expected)) {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${name}`
              });
              core.info(`Deleted exact safe ref: ${name}`);
            }

      - name: Self-delete cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ephemeral-safe-branch-cleanup.yml
          git commit -m "chore: remove ephemeral safe branch cleanup"
          git push origin HEAD:main
