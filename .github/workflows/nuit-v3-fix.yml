name: Fix La nuit apres Orleans V3 bridge

on:
  push:
    branches:
      - feature/nuit-apres-orleans-prototype

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/nuit-apres-orleans-prototype
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/fix_nuit_v3_bridge.py
      - shell: bash
        run: |
          if git diff --quiet -- series/nuit-apres-orleans/audio/nuit-apres-orleans-ep01.json; then
            echo "No fix required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series/nuit-apres-orleans/audio/nuit-apres-orleans-ep01.json
          git commit -m "Respect V3 bridge foreground contract"
          git push origin HEAD:feature/nuit-apres-orleans-prototype
