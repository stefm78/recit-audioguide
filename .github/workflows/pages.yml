name: Build and deploy Récit audioguide

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: recit-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sound-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Sound Direction v1 sidecars
        run: python tools/sound_direction.py validate
      - name: Validate Production v1 specifications
        run: python tools/production.py validate
      - name: Test graceful degradation states
        run: python -m unittest tests.test_states -v

  sounds:
    needs: sound-direction
    permissions:
      contents: write
    uses: stefm78/audio-engine/.github/workflows/hydrate-sounds.yml@e3657805b0ab1c7a21e060379c42bb5b7f7a5497
    with:
      requirements_path: "series/orleans-cathedral/sound-requirements.json"
      artifact_name: "recit-sound-library"
      engine_ref: "e3657805b0ab1c7a21e060379c42bb5b7f7a5497"
      release_tag: "sound-library"
      publish_release: true
      fail_on_unresolved: false

  preview:
    if: github.event_name == 'pull_request'
    needs: sounds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout audio-engine
        uses: actions/checkout@v6
        with:
          repository: stefm78/audio-engine
          ref: e3657805b0ab1c7a21e060379c42bb5b7f7a5497
          path: .audio-engine
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore existing voice and stage caches read-only
        uses: actions/cache/restore@v4
        with:
          path: generated/audio
          key: audio-engine-v4-${{ runner.os }}-${{ github.repository }}-${{ github.sha }}
          restore-keys: |
            audio-engine-v4-${{ runner.os }}-${{ github.repository }}-
            audio-engine-v3-${{ runner.os }}-${{ github.repository }}-
            audio-engine-v2-${{ runner.os }}-${{ github.repository }}-
            audio-engine-v1-${{ runner.os }}-${{ github.repository }}-
      - name: Download hydrated sound library
        uses: actions/download-artifact@v4
        with:
          name: recit-sound-library
          path: sound-library
      - name: Install audio-engine
        run: python -m pip install --disable-pip-version-check ./.audio-engine
      - name: Preview changed audio programs only
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'series/**/audio/*.json')
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No changed audio programs."
            mkdir -p generated/audio-previews
            echo '{"changed_programs":0}' > generated/audio-previews/report.json
            exit 0
          fi
          mkdir -p generated/audio-previews
          printf '%s\n' "${changed[@]}" > generated/audio-previews/programs.txt
          for program in "${changed[@]}"; do
            base_name="$(basename "$program" .json)"
            program_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$program")"
            has_events="$(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(1 if ((d.get("soundscape") or {}).get("events") or []) else 0)' "$program")"
            if [[ "$has_events" == "1" ]]; then
              audio-engine preview "$program" \
                --out generated/audio \
                --sounds sound-library/sounds.json \
                --before-ms 4000 \
                --after-ms 4000 \
                > "generated/audio-previews/${base_name}-preview.json"
            else
              audio-engine render "$program" \
                --out generated/audio \
                --sounds sound-library/sounds.json \
                > "generated/audio-previews/${base_name}-render.json"
              echo '{"status":"rendered-full-only","reason":"no-sound-events"}' \
                > "generated/audio-previews/${base_name}-preview.json"
            fi
            audio-engine timing "$program" --out generated/audio \
              > "generated/audio-previews/${base_name}-timing.json"
            cp "generated/audio/${program_id}/manifest.json" \
              "generated/audio-previews/${base_name}-manifest.json"
            cp "generated/audio/${program_id}/audio.mp3" \
              "generated/audio-previews/${base_name}-full.mp3"
            if [[ -d "generated/audio/${program_id}/previews" ]]; then
              for clip in generated/audio/${program_id}/previews/*.mp3; do
                [[ -e "$clip" ]] || continue
                cp "$clip" "generated/audio-previews/${base_name}-$(basename "$clip")"
              done
            fi
          done
      - name: Upload fast sound-design previews
        uses: actions/upload-artifact@v4
        with:
          name: recit-audio-previews
          path: generated/audio-previews
          if-no-files-found: error
          retention-days: 3

  audio:
    needs: sounds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout caller
        uses: actions/checkout@v6
      - name: Checkout audio-engine
        uses: actions/checkout@v6
        with:
          repository: stefm78/audio-engine
          ref: e3657805b0ab1c7a21e060379c42bb5b7f7a5497
          path: .audio-engine
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore and save production cache
        uses: actions/cache@v4
        with:
          path: generated/audio
          key: audio-engine-v4-${{ runner.os }}-${{ github.repository }}-${{ github.sha }}
          restore-keys: |
            audio-engine-v4-${{ runner.os }}-${{ github.repository }}-
            audio-engine-v3-${{ runner.os }}-${{ github.repository }}-
            audio-engine-v2-${{ runner.os }}-${{ github.repository }}-
            audio-engine-v1-${{ runner.os }}-${{ github.repository }}-
      - name: Download hydrated sound library
        uses: actions/download-artifact@v4
        with:
          name: recit-sound-library
          path: sound-library
      - name: Install audio-engine
        run: python -m pip install --disable-pip-version-check ./.audio-engine
      - name: Produce catalog
        run: >-
          python tools/production.py run
          --source-glob 'series/**/audio/*.json'
          --out generated/audio
          --sounds sound-library/sounds.json
      - name: Collect managed production previews
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import glob, json, shutil
          from pathlib import Path
          out = Path('generated/production-previews')
          out.mkdir(parents=True, exist_ok=True)
          for spec_path in glob.glob('series/*/production.json'):
              spec = json.load(open(spec_path, encoding='utf-8'))
              base = Path(spec_path).parent
              program = json.load(open(base / spec['program'], encoding='utf-8'))
              program_id = program['id']
              src = Path('generated/audio') / program_id
              dst = out / program_id
              dst.mkdir(parents=True, exist_ok=True)
              for name in ('audio.mp3', 'manifest.json', 'transcript.json'):
                  if (src / name).exists():
                      shutil.copy2(src / name, dst / name)
              plan = Path('generated/audio/.production') / program_id / 'sequence-plan.json'
              if plan.exists():
                  shutil.copy2(plan, dst / 'sequence-plan.json')
          PY
      - name: Upload managed production previews
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: recit-production-previews
          path: generated/production-previews
          if-no-files-found: error
          retention-days: 3
      - name: Upload audio assets
        uses: actions/upload-artifact@v4
        with:
          name: recit-audio-assets
          path: generated/audio
          if-no-files-found: error
          retention-days: 1

  build:
    needs: audio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download generated audio
        uses: actions/download-artifact@v4
        with:
          name: recit-audio-assets
          path: generated/audio
      - name: Build static site
        run: python site/build.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
