name: Build and deploy Récit audioguide

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: recit-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sounds:
    permissions:
      contents: write
    uses: stefm78/audio-engine/.github/workflows/hydrate-sounds.yml@d643414a540ba2e3195cdd6b7b0de124dc168659
    with:
      requirements_path: "sound-requirements.json"
      artifact_name: "recit-sound-library"
      engine_ref: "d643414a540ba2e3195cdd6b7b0de124dc168659"
      release_tag: "sound-library"
      publish_release: true
      fail_on_unresolved: true

  audio:
    needs: sounds
    uses: stefm78/audio-engine/.github/workflows/render.yml@d643414a540ba2e3195cdd6b7b0de124dc168659
    with:
      source_glob: "series/**/audio/*.json"
      output_dir: "generated/audio"
      artifact_name: "recit-audio-assets"
      engine_ref: "d643414a540ba2e3195cdd6b7b0de124dc168659"
      sounds_artifact_name: "recit-sound-library"
      sounds_artifact_path: "sound-library"

  build:
    needs: audio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download generated audio
        uses: actions/download-artifact@v4
        with:
          name: recit-audio-assets
          path: generated/audio
      - name: Build static site
        run: python site/build.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
