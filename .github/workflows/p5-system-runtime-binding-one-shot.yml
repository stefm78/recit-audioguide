name: P5 system runtime production plan one-shot

on:
  push:
    branches:
      - prod/p5-system-runtime-binding-v1
    paths:
      - .github/workflows/p5-system-runtime-binding-one-shot.yml

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: stefm78/audio-engine
          ref: e82559cbd60b1d29de208e7e36ccd7505dcfcdcc
          path: .audio-engine
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate exact Production plan
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ./.audio-engine
          audio-engine production validate             series/odyssee/production/ODYSSEE_PRODUCTION_MANIFEST_V1.json             --verify-files --workspace-root .
          audio-engine production plan             series/odyssee/production/ODYSSEE_PRODUCTION_MANIFEST_V1.json             --workspace-root . | tee /tmp/plan.json
          python - <<'PY'
          import json
          plan=json.load(open("/tmp/plan.json",encoding="utf-8"))
          s08=next(item for item in plan["ready_units"] if item["id"]=="S08")
          b=next(item for item in plan["assemblies"] if item["id"]=="B")
          assert s08["python_version"]=="3.11.16", s08
          assert s08["provider_package_count"]==1, s08
          assert s08["asset_count"]==1, s08
          assert b["state"]=="ready", b
          print(json.dumps({"S08":s08,"BlockB":b},indent=2))
          PY
