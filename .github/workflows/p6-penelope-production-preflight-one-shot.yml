name: P6 Penelope production preflight one-shot

on:
  push:
    branches:
      - prod/p6-penelope-package-v1
    paths:
      - .github/workflows/p6-penelope-production-preflight-one-shot.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: stefm78/audio-engine
          ref: 0d66509ffdeeca37dc727954949587155e80832f
          path: .audio-engine
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ./.audio-engine
      - name: Validate P6 Penelope exact materialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from audio_engine.contract import validate_program
          from audio_engine.provider_package import validate_provider_package

          root=Path(".")
          program_path=root/"series/odyssee/programs/S15.json"
          binding_path=root/"series/odyssee/production/P6_FROZEN_S15_BINDING_V1.json"
          package_path=root/"series/odyssee/production/provider-packages/P6_PENELOPE_CHATTERBOX_MULTILINGUAL_V3_V1.json"
          mapping_path=root/"series/odyssee/production/P6_PENELOPE_PROVIDER_BINDING_V1.json"

          program=json.loads(program_path.read_text(encoding="utf-8"))
          binding=json.loads(binding_path.read_text(encoding="utf-8"))
          package=json.loads(package_path.read_text(encoding="utf-8"))
          mapping=json.loads(mapping_path.read_text(encoding="utf-8"))

          validate_program(program)
          validate_provider_package(
              package,
              package_path=package_path,
              workspace_root=root,
              verify_files=False,
          )

          expected={x["segment"]:x for x in binding["penelope_local_performance"]["segments"]}
          mapped=[]
          for i,seg in enumerate(program["segments"],1):
              if i in expected:
                  auth=expected[i]
                  assert seg["speaker"]==auth["speaker"], (i,"speaker")
                  assert seg["text"]==auth["text"], (i,"text")
                  assert seg["performance_provider"]=="chatterbox-multilingual-v3", i
                  assert seg["provider_seed"]==660200+i, i
                  assert seg["provider_parameters"]=={
                      "language_id":"fr",
                      "reference":"synthetic-vivienne",
                      "exaggeration":auth["exaggeration"],
                      "cfg_weight":auth["cfg_weight"],
                      "temperature":auth["temperature"],
                  }, i
                  assert seg["placement"]=="center", i
                  mapped.append(i)
              else:
                  assert "performance_provider" not in seg, i
                  assert "provider_seed" not in seg, i
                  assert "provider_parameters" not in seg, i

          assert mapped==sorted(expected), (mapped,sorted(expected))
          assert program["production"]["blockers"]==["ULYSSES_EMOTIONAL_HUMAN_PASS"]
          assert mapping["segments"] and len(mapping["segments"])==len(expected)
          assert package["synthesis"]["seed"]==660200
          assert package["fallback"]=="fail"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          report={
              "status":"PASS",
              "mapped_segments":mapped,
              "mapped_count":len(mapped),
              "program_sha256":sha(program_path),
              "package_sha256":sha(package_path),
              "mapping_sha256":sha(mapping_path),
              "engine_ref":"0d66509ffdeeca37dc727954949587155e80832f",
              "remaining_hold":"ULYSSES_EMOTIONAL_HUMAN_PASS",
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
