name: Odyssée Télémaque French-clean Chatterbox probe

on:
  push:
    branches:
      - prod/178-telemaque-chatterbox-fr-probe
    paths:
      - '.github/workflows/odyssee-telemaque-fr-clean-probe.yml'

permissions:
  contents: write
  issues: write

env:
  AUDIO_ENGINE_REF: ae03c9afc641459ef9287dc528e127d357cbc615
  RELEASE_TAG: odyssee-telemaque-fr-clean-probe-v1
  SOURCE_RELEASE_TAG: odyssee-p1-review-v1

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Lock Stream 1 authority and frozen product inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          root = Path('.')
          def load(path):
              return json.loads((root / path).read_text(encoding='utf-8'))
          def sha(path):
              h = hashlib.sha256()
              with (root / path).open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          authority_path = 'series/odyssee/review/TELEMAQUE_FRENCH_CLEAN_PATH_V1.json'
          authority = load(authority_path)
          assert authority['status'] == 'TELEMAQUE_CHATTERBOX_FR_REFERENCE_PROBE_AUTHORIZED'
          assert authority['diagnosis']['accepted'] == 'TELEMAQUE_REMY_MULTILINGUAL_EDGE_FRENCH_NOT_GUARANTEED'
          assert authority['diagnosis']['further_edge_retry_authorized'] is False
          decision = authority['product_decision']
          assert decision['provider'] == 'chatterbox-multilingual-v3'
          assert decision['language_id'] == 'fr'
          assert decision['local_only'] is True and decision['cloud'] is False
          assert decision['recast_at_entry'] is False
          assert decision['frozen_text_change'] is False
          assert decision['reference_strategy']['source_release'] == 'odyssee-p1-review-v1'
          assert decision['reference_strategy']['source_asset'] == 'p1.mp3'
          assert decision['reference_strategy']['timing_asset'] == 'timing.json'
          probe = decision['probe']
          assert probe['scene'] == 'S12'
          assert probe['exact_segments'] == [137, 147, 153]
          assert all(probe[k] is True for k in ['one_parameter_set','no_best_of_n','no_seed_retry','no_tuning_loop','dry'])
          assert authority['human_gate']['pass'] == 'TELEMAQUE_FRENCH_CLEAN_PATH_HUMAN_PASS'
          assert authority['human_gate']['fail'] == 'HOLD_TELEMAQUE_CHATTERBOX_IDENTITY_OR_NATURALNESS'

          manifest = load('series/odyssee/production/ODYSSEE_PRODUCTION_MANIFEST_V1.json')
          unit = next(x for x in manifest['units'] if x['id'] == 'S12')
          assert unit['program'] == 'series/odyssee/programs/S12.json'
          assert unit['program_sha256'] == sha(unit['program'])
          assert unit['voice_pack'] == 'series/odyssee/production/voice-packs/ODYSSEE_PRODUCTION_V1.json'
          assert unit['voice_pack_sha256'] == sha(unit['voice_pack'])

          s12 = load(unit['program'])
          expected = {
              137: 'Qui es-tu ?',
              147: 'Tous les hommes qui arrivent à Ithaque ont vu mon père. Certains ont bu avec lui. D’autres lui ont parlé hier. Et maintenant toi, tu es lui ?',
              153: 'Tu ne peux pas entrer dans une pièce et dire ce mot comme si—',
          }
          for n, text in expected.items():
              seg = s12['segments'][n - 1]
              assert seg['speaker'] == 'TÉLÉMAQUE'
              assert seg['character_id'] == 'telemaque'
              assert seg['preset'] == 'odyssee-telemaque'
              assert seg['text'] == text
              assert not any(k in seg for k in ['voice','rate','pitch','volume','provider','performance_provider','provider_parameters','provider_seed'])

          voices = load(unit['voice_pack'])
          preset = next(x for x in voices['presets'] if x['id'] == 'odyssee-telemaque')
          assert preset == {
              'id': 'odyssee-telemaque',
              'voice': 'fr-FR-RemyMultilingualNeural',
              'rate': '+5%',
              'pitch': '+8Hz',
              'volume': '+2%',
              'provider': 'edge',
              'acceptance': 'HUMAN_ACCEPTED_P1',
          }

          p1 = load('series/odyssee/audio/odyssee-probe-p1.json')
          p1t = p1['segments'][2]
          assert p1t['character_id'] == 'telemaque'
          assert p1t['speaker'] == 'Télémaque'
          assert p1t['voice'] == preset['voice']
          assert p1t['rate'] == preset['rate']
          assert p1t['pitch'] == preset['pitch']
          assert p1t['volume'] == preset['volume']

          evidence = (root / 'docs/evidence/odyssee-p1-human-pass-2026-08-30.md').read_text(encoding='utf-8')
          assert 'Ulysse vs Télémaque: **PASS**' in evidence
          assert 'Français sentinelles: **PASS**' in evidence
          assert 'Aucun signalé.' in evidence

          package = load('series/odyssee/production/provider-packages/P5_CHATTERBOX_MULTILINGUAL_V3_V1.json')
          assert package['provider']['id'] == 'chatterbox-multilingual-v3'
          assert package['voice_pack_sha256'] == sha(unit['voice_pack'])
          assert package['synthesis']['parameters']['language_id'] == 'fr'
          assert package['fallback'] == 'fail'
          print('TELEMAQUE_178_BOUNDED_CONTRACT_PASS')
          PY

  render:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout exact promoted Audio Engine
        uses: actions/checkout@v6
        with:
          repository: stefm78/audio-engine
          ref: ${{ env.AUDIO_ENGINE_REF }}
          path: .audio-engine

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: .audio-engine/requirements/chatterbox-mtl-v3-h1b-runtime.txt

      - name: Refuse any second probe run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing immutable probe Release; refusing any rerender: $RELEASE_TAG" >&2
            exit 2
          fi

      - name: Install promoted local Chatterbox runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bash .audio-engine/scripts/install_chatterbox_mtl_v3_h1b.sh
          python -m pip install --disable-pip-version-check --no-deps             "imageio-ffmpeg==0.6.0" "edge-tts==7.2.8"
          python -m pip install --disable-pip-version-check --no-deps ./.audio-engine

      - name: Download immutable HUMAN-PASS P1 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p generated/telemaque-fr-clean/source
          gh release download "$SOURCE_RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --pattern p1.mp3             --pattern timing.json             --dir generated/telemaque-fr-clean/source
          test -s generated/telemaque-fr-clean/source/p1.mp3
          test -s generated/telemaque-fr-clean/source/timing.json

      - name: Freeze exact P1 Télémaque reference and materialize only 3 frozen S12 lines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/telemaque-fr-clean/input/reference
          python - <<'PY'
          import copy, hashlib, json, re, subprocess
          from pathlib import Path

          root = Path('.').resolve()
          source = root / 'generated/telemaque-fr-clean/source'
          out = root / 'generated/telemaque-fr-clean/input'
          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def write(path, data):
              path = Path(path); path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          def sha(path):
              h = hashlib.sha256()
              with Path(path).open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          def evidence_hash(label):
              text = (root / 'docs/evidence/odyssee-p1-human-pass-2026-08-30.md').read_text(encoding='utf-8')
              m = re.search(rf'^- {re.escape(label)}: `([0-9a-f]{{64}})`$', text, re.MULTILINE)
              assert m, label
              return m.group(1)

          p1_mp3 = source / 'p1.mp3'
          timing_path = source / 'timing.json'
          assert sha(p1_mp3) == evidence_hash('Audio SHA-256')
          assert sha(timing_path) == evidence_hash('Timing SHA-256')

          p1 = load(root / 'series/odyssee/audio/odyssee-probe-p1.json')
          timing = load(timing_path)
          assert timing['program_id'] == p1['id']
          assert timing['exact_segments'] == len(p1['segments'])
          assert timing['estimated_segments'] == 0
          by_seq = {int(x['sequence']): x for x in timing['segments']}
          assert sorted(by_seq) == list(range(1, len(p1['segments']) + 1))
          for n, item in by_seq.items():
              assert item['timing_source'] == 'measured-cache', n
              assert float(item['duration_ms']) > 0

          cursor = float(p1.get('lead_in_ms', 250))
          for n in (1, 2):
              cursor += float(by_seq[n]['duration_ms'])
              cursor += float(p1['segments'][n - 1].get('pause_after_ms', 350))
          duration = float(by_seq[3]['duration_ms'])
          ref = out / 'reference/telemaque-p1-human-pass.wav'
          subprocess.run([
              'ffmpeg','-hide_banner','-loglevel','error','-y',
              '-i',str(p1_mp3),'-ss',f'{cursor/1000:.6f}','-t',f'{duration/1000:.6f}',
              '-vn','-map_metadata','-1','-ac','1','-ar','24000','-c:a','pcm_s16le',str(ref)
          ], check=True)
          assert ref.is_file() and ref.stat().st_size > 44
          ref_sha = sha(ref)

          package = load(root / 'series/odyssee/production/provider-packages/P5_CHATTERBOX_MULTILINGUAL_V3_V1.json')
          package = copy.deepcopy(package)
          package['id'] = 'odyssee-telemaque-chatterbox-fr-reference-probe-v1'
          package['synthesis']['parameters']['language_id'] = 'fr'
          package['synthesis']['parameters']['reference'] = 'p1-telemaque-human-pass'
          package['references'] = [{
              'id': 'p1-telemaque-human-pass',
              'path': 'generated/telemaque-fr-clean/input/reference/telemaque-p1-human-pass.wav',
              'sha256': ref_sha,
          }]
          package.pop('acceptance', None)
          write(out / 'provider-package.json', package)

          s12 = load(root / 'series/odyssee/programs/S12.json')
          targets = [137,147,153]
          probe = {
              'schema_version': s12['schema_version'],
              'id': 'odyssee-telemaque-fr-clean-probe',
              'title': 'L’Odyssée — Télémaque French-clean bounded Chatterbox probe',
              'language': s12.get('language','fr-FR'),
              'profile': s12.get('profile','speech'),
              'acoustic_space': 'dry',
              'actors': {'telemaque': {'placement': 'center'}},
              'segments': [],
          }
          fixed_seed = int(package['synthesis']['seed'])
          snapshots = []
          for n in targets:
              seg = copy.deepcopy(s12['segments'][n - 1])
              assert seg['speaker'] == 'TÉLÉMAQUE' and seg['character_id'] == 'telemaque'
              assert seg['preset'] == 'odyssee-telemaque'
              seg['source_sequence'] = n
              seg['performance_provider'] = 'chatterbox-multilingual-v3'
              seg['provider_seed'] = fixed_seed
              probe['segments'].append(seg)
              snapshots.append({'segment':n,'speaker':seg['speaker'],'text':seg['text'],'preset':seg['preset']})
          write(out / 'probe-program.json', probe)

          lock = {
              'source_release':'odyssee-p1-review-v1',
              'source_audio':'p1.mp3',
              'source_audio_sha256':sha(p1_mp3),
              'source_timing':'timing.json',
              'source_timing_sha256':sha(timing_path),
              'source_program':'series/odyssee/audio/odyssee-probe-p1.json',
              'source_program_sha256':sha(root / 'series/odyssee/audio/odyssee-probe-p1.json'),
              'source_segment':3,
              'source_text':p1['segments'][2]['text'],
              'start_ms':round(cursor,3),
              'end_ms':round(cursor+duration,3),
              'duration_ms':round(duration,3),
              'reference_wav':'generated/telemaque-fr-clean/input/reference/telemaque-p1-human-pass.wav',
              'reference_sha256':ref_sha,
          }
          write(out / 'reference-lock.json', lock)
          plan = {
              'schema':'recit.odyssee.telemaque_french_clean_probe_plan.v1',
              'status':'READY_TO_RENDER_TELEMAQUE_CHATTERBOX_FR_REFERENCE_PROBE',
              'authority':'series/odyssee/review/TELEMAQUE_FRENCH_CLEAN_PATH_V1.json',
              'provider':'chatterbox-multilingual-v3',
              'language_id':'fr',
              'fixed_provider_seed':fixed_seed,
              'reference_lock':lock,
              'target_segments':snapshots,
              'constraints':{
                  'local_inference_only':True,'cloud_tts':False,'single_parameter_set':True,
                  'best_of_n':False,'seed_retry':False,'tuning_loop':False,'dry':True,
                  'frozen_text_change':False,'ulysse_change':False,'round3_edge':False,
                  'remy_edge_retry':False,'provider_sweep':False
              }
          }
          write(out / 'plan.json', plan)
          print(json.dumps(plan, ensure_ascii=False, indent=2))
          PY
          jq -e '
            .status == "READY_TO_RENDER_TELEMAQUE_CHATTERBOX_FR_REFERENCE_PROBE"
            and .provider == "chatterbox-multilingual-v3"
            and .language_id == "fr"
            and .constraints.local_inference_only == true
            and .constraints.cloud_tts == false
            and .constraints.single_parameter_set == true
            and .constraints.best_of_n == false
            and .constraints.seed_retry == false
            and .constraints.tuning_loop == false
            and .constraints.dry == true
            and .constraints.frozen_text_change == false
            and .constraints.ulysse_change == false
            and .constraints.round3_edge == false
            and .constraints.remy_edge_retry == false
            and .constraints.provider_sweep == false
            and (.target_segments | map(.segment)) == [137,147,153]
            and (.reference_lock.reference_sha256 | length) == 64
          ' generated/telemaque-fr-clean/input/plan.json >/dev/null
          sha256sum generated/telemaque-fr-clean/input/reference/telemaque-p1-human-pass.wav

      - name: Restore promoted Chatterbox model cache
        uses: actions/cache@v4
        with:
          path: generated/provider-models
          key: telemaque-178-${{ runner.os }}-chatterbox-${{ hashFiles('series/odyssee/production/provider-packages/P5_CHATTERBOX_MULTILINGUAL_V3_V1.json') }}

      - name: Hydrate and verify promoted local model and frozen reference
        shell: bash
        run: |
          set -euo pipefail
          package=generated/telemaque-fr-clean/input/provider-package.json
          audio-engine provider-package hydrate-model "$package"             --cache-root generated/provider-models             > generated/telemaque-fr-clean/model-hydration.json
          audio-engine provider-package hydrate-references "$package"             --workspace-root .             > generated/telemaque-fr-clean/reference-hydration.json
          audio-engine provider-package validate "$package"             --verify-files             --workspace-root .             --voice-pack series/odyssee/production/voice-packs/ODYSSEE_PRODUCTION_V1.json             > generated/telemaque-fr-clean/provider-validation.json

      - name: Synthesize the 3 authorized lines exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/telemaque-fr-clean/render/.cache/voices
          audio-engine provider-cache prewarm             generated/telemaque-fr-clean/input/probe-program.json             --voices series/odyssee/production/voice-packs/ODYSSEE_PRODUCTION_V1.json             --provider-package generated/telemaque-fr-clean/input/provider-package.json             --cache-root generated/telemaque-fr-clean/render/.cache/voices             --provider-model-cache generated/provider-models             --workspace-root .             --report generated/telemaque-fr-clean/prewarm-report.json
          jq -e '
            .status == "ready"
            and .provider == "chatterbox-multilingual-v3"
            and .segment_count == 3
            and .cache_hits == 0
            and .cache_misses == 3
          ' generated/telemaque-fr-clean/prewarm-report.json >/dev/null

      - name: Render cache-only and machine QA
        shell: bash
        run: |
          set -euo pipefail
          audio-engine render generated/telemaque-fr-clean/input/probe-program.json             --out generated/telemaque-fr-clean/render             --voices series/odyssee/production/voice-packs/ODYSSEE_PRODUCTION_V1.json             --workspace-root .             --provider-model-cache generated/provider-models             --provider-package generated/telemaque-fr-clean/input/provider-package.json             --cache-only-promoted-provider chatterbox-multilingual-v3             > generated/telemaque-fr-clean/render.json
          audio-engine qa generated/telemaque-fr-clean/render/odyssee-telemaque-fr-clean-probe             > generated/telemaque-fr-clean/render/odyssee-telemaque-fr-clean-probe/qa-report.json
          jq -e '.status == "PASS"' generated/telemaque-fr-clean/render/odyssee-telemaque-fr-clean-probe/qa-report.json >/dev/null

      - name: Collect immutable machine-ready human gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/telemaque-fr-clean/release
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          root = Path('.').resolve()
          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
              return h.hexdigest()
          def write(path,data):
              Path(path).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          plan=load(root/'generated/telemaque-fr-clean/input/plan.json')
          prewarm=load(root/'generated/telemaque-fr-clean/prewarm-report.json')
          render_root=root/'generated/telemaque-fr-clean/render/odyssee-telemaque-fr-clean-probe'
          qa=load(render_root/'qa-report.json')
          assert qa['status']=='PASS'
          transcript=load(render_root/'transcript.json')
          segs=transcript['segments']
          assert len(segs)==3
          snapshots=[]
          for source_n, seg, expected in zip([137,147,153],segs,plan['target_segments']):
              assert seg['speaker']==expected['speaker'] and seg['text']==expected['text']
              assert seg['preset']=='odyssee-telemaque'
              assert seg['identity_provider']=='edge'
              assert seg['voice']=='fr-FR-RemyMultilingualNeural'
              assert seg['provider']=='chatterbox-multilingual-v3'
              assert seg['performance_provider']=='chatterbox-multilingual-v3'
              assert int(seg['provider_seed'])==int(plan['fixed_provider_seed'])
              snapshots.append({
                  'source_segment':source_n,'speaker':seg['speaker'],'text':seg['text'],
                  'identity_provider':seg['identity_provider'],'voice':seg['voice'],
                  'rate':seg['rate'],'pitch':seg['pitch'],'volume':seg['volume'],
                  'provider':seg['provider'],'performance_provider':seg['performance_provider'],
                  'provider_seed':seg['provider_seed']
              })

          release=root/'generated/telemaque-fr-clean/release'
          shutil.copy2(render_root/'audio.mp3',release/'telemaque-fr-clean-probe.mp3')
          shutil.copy2(root/plan['reference_lock']['reference_wav'],release/'telemaque-p1-human-pass-reference.wav')
          shutil.copy2(render_root/'qa-report.json',release/'telemaque-fr-clean-probe.qa-report.json')
          index={
              'schema':'recit.odyssee.telemaque_french_clean_probe_release.v1',
              'status':'MACHINE_READY_TELEMAQUE_CHATTERBOX_FR_REFERENCE_PROBE',
              'product_sha':'${{ github.sha }}',
              'audio_engine_ref':'ae03c9afc641459ef9287dc528e127d357cbc615',
              'provider':'chatterbox-multilingual-v3','language_id':'fr',
              'reference':{**plan['reference_lock'],'release_asset':'telemaque-p1-human-pass-reference.wav'},
              'probe':{
                  'release_asset':'telemaque-fr-clean-probe.mp3',
                  'sha256':sha(release/'telemaque-fr-clean-probe.mp3'),
                  'qa_asset':'telemaque-fr-clean-probe.qa-report.json',
                  'qa_sha256':sha(release/'telemaque-fr-clean-probe.qa-report.json'),
                  'source_segments':[137,147,153],
                  'transcript_snapshot':snapshots,
              },
              'single_parameter_set':load(root/'generated/telemaque-fr-clean/input/provider-package.json')['synthesis'],
              'prewarm':prewarm,'constraints':plan['constraints'],'machine_qa':'PASS',
              'human_gate':{
                  'dimensions':[
                      'French is fully natural with zero non-French passage',
                      'Télémaque remains recognisably continuous with the accepted P1 identity',
                      'young-adult role credibility','natural phrasing',
                      'clear distinction from Ulysse','no caricature'
                  ],
                  'pass':'TELEMAQUE_FRENCH_CLEAN_PATH_HUMAN_PASS',
                  'fail':'HOLD_TELEMAQUE_CHATTERBOX_IDENTITY_OR_NATURALNESS'
              },
              'h2':'SUSPENDED_PENDING_TELEMAQUE_HUMAN_GATE'
          }
          write(release/'telemaque-fr-clean-probe-index.json',index)
          PY
          jq -e '
            .status == "MACHINE_READY_TELEMAQUE_CHATTERBOX_FR_REFERENCE_PROBE"
            and .machine_qa == "PASS"
            and .provider == "chatterbox-multilingual-v3"
            and .language_id == "fr"
            and .human_gate.pass == "TELEMAQUE_FRENCH_CLEAN_PATH_HUMAN_PASS"
            and .human_gate.fail == "HOLD_TELEMAQUE_CHATTERBOX_IDENTITY_OR_NATURALNESS"
            and .h2 == "SUSPENDED_PENDING_TELEMAQUE_HUMAN_GATE"
          ' generated/telemaque-fr-clean/release/telemaque-fr-clean-probe-index.json >/dev/null
          test "$(find generated/telemaque-fr-clean/release -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Upload exact run evidence
        uses: actions/upload-artifact@v4
        with:
          name: odyssee-telemaque-fr-clean-probe-v1
          path: |
            generated/telemaque-fr-clean/release
            generated/telemaque-fr-clean/input
            generated/telemaque-fr-clean/model-hydration.json
            generated/telemaque-fr-clean/reference-hydration.json
            generated/telemaque-fr-clean/provider-validation.json
            generated/telemaque-fr-clean/prewarm-report.json
            generated/telemaque-fr-clean/render.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish immutable bounded probe Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             generated/telemaque-fr-clean/release/*             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --prerelease             --title "Odyssée — Télémaque French-clean bounded Chatterbox probe"             --notes "#178 only. One local Chatterbox Multilingual V3 parameter set with language_id=fr, conditioned on the exact HUMAN-PASS P1 Télémaque reference. Exact frozen S12 segments 137/147/153. No best-of-N, no seed retry, no tuning loop, no cloud TTS, no text change, no Remy/Edge retry, no Ulysse change, no Round 3 Edge. HUMAN verdict still required; H2 remains suspended."

      - name: Return machine-ready human gate to issue 178 only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ref_sha=$(jq -r '.reference.reference_sha256' generated/telemaque-fr-clean/release/telemaque-fr-clean-probe-index.json)
          probe_sha=$(jq -r '.probe.sha256' generated/telemaque-fr-clean/release/telemaque-fr-clean-probe-index.json)
          cat > generated/telemaque-fr-clean/comment.md <<EOF
