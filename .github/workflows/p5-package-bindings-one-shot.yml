name: P5 production plan one-shot

on:
  push:
    branches:
      - prod/p5-integration-v2
    paths:
      - .github/workflows/p5-package-bindings-one-shot.yml

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: stefm78/audio-engine
          ref: ea57a1dca1277526be010ad301de1eeca624f409
          path: .audio-engine
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install engine
        run: python -m pip install --disable-pip-version-check ./.audio-engine
      - name: Validate and plan Production
        shell: bash
        run: |
          set -euo pipefail
          audio-engine production validate             series/odyssee/production/ODYSSEE_PRODUCTION_MANIFEST_V1.json             --verify-files --workspace-root .
          audio-engine production plan             series/odyssee/production/ODYSSEE_PRODUCTION_MANIFEST_V1.json             --workspace-root . | tee /tmp/plan.json
          python - <<'PY'
          import json
          plan=json.load(open("/tmp/plan.json",encoding="utf-8"))
          s08=next(item for item in plan["ready_units"] if item["id"]=="S08")
          assert s08["providers"] == ["edge","chatterbox-multilingual-v3"], s08
          assert s08["provider_package_count"] == 1, s08
          assert s08["asset_count"] == 1, s08
          assert s08["python_version"] == "3.11.16", s08
          block_b=next(item for item in plan["assemblies"] if item["id"]=="B")
          assert block_b["state"] == "ready", block_b
          print(json.dumps({
              "S08":s08,
              "BlockB":block_b,
              "master":plan["master"],
          },ensure_ascii=False,indent=2))
          PY
