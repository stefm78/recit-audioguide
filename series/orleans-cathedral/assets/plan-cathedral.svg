<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Schéma de repérage de la cathédrale Sainte-Croix d'Orléans</title>
<desc id="desc">Plan simplifié, entrée à l'ouest à gauche, chœur à l'est à droite, huit étapes numérotées.</desc>
<defs><style>.wall{fill:#f9f5ea;stroke:#26393f;stroke-width:16;stroke-linejoin:round}.inner{fill:none;stroke:#aab5b2;stroke-width:3}.label{font:700 24px system-ui,sans-serif;fill:#31454b}.small{font:600 17px system-ui,sans-serif;fill:#617179}.num{font:900 26px system-ui,sans-serif;fill:white}.dot{fill:#0d4360;stroke:#d5a530;stroke-width:6}.route{fill:none;stroke:#d5a530;stroke-width:7;stroke-dasharray:12 10;stroke-linecap:round;stroke-linejoin:round}</style></defs>
